<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>首页</title>
<style>
:root{font-family:Roboto,"Noto Sans CJK SC",Arial,sans-serif;color:#202124;background:#f8fafd;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:48px 24px 30px}.brand{text-align:center;margin:0 0 30px}.mark{display:inline-grid;place-items:center;background:#d3e3fd;border-radius:24px;width:68px;height:68px;color:#185abc;margin-bottom:14px}.mark svg{width:36px;height:36px}.brand h1{font-size:28px;letter-spacing:1px;font-weight:500;margin:0}.brand p{font-size:13px;color:#687386;margin:10px 0 0}.search{display:flex;align-items:center;background:#e8eef8;border:1px solid #dfe6f1;border-radius:30px;padding:0 9px 0 20px;min-height:58px;box-shadow:0 2px 4px #1a376508}.g{font-weight:700;font-size:23px;color:#4285f4;margin-right:13px}.search input{font:inherit;font-size:15px;min-width:0;flex:1;border:0;outline:0;background:transparent;color:#202124;padding:17px 0}.search:focus-within{outline:2px solid #a8c7fa}.search button{border:0;border-radius:50%;background:transparent;color:#185abc;width:44px;height:44px;font-size:25px}.hint{text-align:center;color:#7c8697;font-size:11px;margin:10px 0 28px}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;margin-bottom:30px}a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}.shortcut{text-align:center;min-width:0}.circle{width:50px;height:50px;border-radius:18px;background:#e8eef8;display:grid;place-items:center;margin:0 auto 9px;font-size:23px;color:#3c5a85}.shortcut span:last-child{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shortcut:focus-visible,.row:focus-visible{outline:2px solid #4285f4;border-radius:14px}.google{color:#4285f4;background:#edf2fc;font-weight:bold}.wiki{font-family:Georgia,serif;background:#eeeef1;color:#30343b}.youtube{color:#e34b48;background:#fbeeed}.star{color:#966618;background:#faf2df}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.section-head h2{font-size:14px;font-weight:500;margin:0;color:#505969}.section-head a{font-size:12px;color:#1967d2;padding:8px}.panel{border:1px solid #e4e8f0;border-radius:20px;background:white;overflow:hidden}.row{display:flex;align-items:center;min-height:68px;padding:12px 16px;gap:14px}.row+.row{border-top:1px solid #f0f2f6}.row .badge{flex-shrink:0;width:36px;height:36px;background:#edf2fa;border-radius:12px;display:grid;place-items:center;color:#54719c;font-size:17px}.row .words{min-width:0;flex:1}.row b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{display:block;color:#8790a0;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:#a8b2c2}.empty{margin:0;padding:20px 17px;font-size:13px;line-height:1.8;color:#8790a0}.footer{display:flex;justify-content:center;gap:28px;padding:28px 0 6px;color:#67758b;font-size:12px}.footer a{padding:10px}svg{vertical-align:middle}
/* Motion: one staggered rise on open, tactile press states, rows that slide in as they load. */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-8deg)}60%{opacity:1;transform:scale(1.06) rotate(2deg)}100%{transform:none}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mark{background:linear-gradient(145deg,#d3e3fd,#e8f0fe);box-shadow:0 8px 20px #1a73e81f;animation:pop .6s cubic-bezier(.2,0,0,1) both}.mark svg{animation:drift 4s ease-in-out .8s infinite}
.brand h1,.brand p,.search,.hint,.shortcut,section,.footer{animation:rise .5s cubic-bezier(.2,0,0,1) both}
.brand h1{animation-delay:.08s}.brand p{animation-delay:.12s}.search{animation-delay:.16s}.hint{animation-delay:.2s}
.shortcut:nth-child(1){animation-delay:.24s}.shortcut:nth-child(2){animation-delay:.28s}.shortcut:nth-child(3){animation-delay:.32s}.shortcut:nth-child(4){animation-delay:.36s}
section:nth-of-type(1){animation-delay:.4s}section:nth-of-type(2){animation-delay:.46s}.footer{animation-delay:.52s}
.search{transition:background .2s,border-color .2s,box-shadow .25s}.search:focus-within{outline:none;background:#fff;border-color:#a8c7fa;box-shadow:0 0 0 4px #d3e3fd99,0 6px 18px #1a376514}
.search button{transition:transform .15s,background .15s}.search button:active{transform:scale(.88);background:#d3e3fd}
.circle{transition:transform .18s cubic-bezier(.2,0,0,1),box-shadow .18s}.shortcut:active .circle{transform:scale(.9);box-shadow:0 0 0 6px #e8eef8}
.panel{transition:box-shadow .2s}.row{transition:background .15s}.row:active{background:#f3f6fb}.row .arrow{transition:transform .2s}.row:active .arrow{transform:translateX(3px)}
.row.enter{animation:rise .42s cubic-bezier(.2,0,0,1) both}.section-head a{border-radius:10px;transition:background .15s}.section-head a:active{background:#e8f0fe}
.footer a{border-radius:12px;transition:background .15s}.footer a:active{background:#e8eef8}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-10px 0 28px}.modes .local:nth-child(2){animation-delay:.27s;background:linear-gradient(135deg,#e6f4ea,#f3faf5);border-color:#cfe8d6}.modes .local:nth-child(2) b{color:#137333}
.local{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#e8f0fe,#f3f7fe);border:1px solid #d6e3fb;animation:rise .5s cubic-bezier(.2,0,0,1) .22s both;transition:transform .18s cubic-bezier(.2,0,0,1),box-shadow .2s}.local:active{transform:scale(.98);box-shadow:0 4px 14px #1a73e81f}
.local .arrow{display:none}.local-icon{flex-shrink:0;width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 6px #1a73e814}.local-words{flex:1;min-width:0}.local b{display:block;font-size:15px;font-weight:500;color:#0b57d0}.local small{display:block;font-size:12px;color:#5f6b7e;margin-top:4px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:340px){.modes{grid-template-columns:1fr}}@media(max-width:360px){main{padding:30px 18px}.brand{margin-bottom:24px}.brand h1{font-size:25px}.shortcuts{gap:18px 6px}}@media(min-width:700px){main{padding-top:72px}}
/* Compact home: keep search, favorites and recent pages in the first screen. */
main{padding:18px 20px 24px}.brand{display:grid;grid-template-columns:48px 1fr;column-gap:12px;text-align:left;margin:0 0 20px;align-items:center}.mark{grid-row:1/3;width:48px;height:48px;border-radius:16px;margin:0}.mark svg{width:28px;height:28px}.brand h1{font-size:22px;letter-spacing:0}.brand p{font-size:12px;margin:4px 0 0}.hint{margin:8px 0 18px}.shortcuts{margin-bottom:14px;gap:12px 8px}.circle{width:44px;height:44px;border-radius:15px;margin-bottom:7px}.section-head{margin:12px 0 6px}.row{min-height:60px;padding:10px 14px}.empty{padding:15px}.search{min-height:54px;cursor:pointer}.search-prompt{flex:1;font-size:15px;color:#637085;padding:16px 0}.search>span:last-child{font-size:25px;color:#185abc;padding:0 12px}.search:focus-visible{outline:2px solid #a8c7fa}
@media(max-width:360px){main{padding:14px 16px 20px}.brand{margin-bottom:16px}.brand h1{font-size:21px}}
.sites-head{margin:0 0 6px}.sites-head>span{font-size:11px;color:#8790a0}.shortcuts{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;gap:8px;background:white;border:1px solid #e4e8f0;border-radius:20px;padding:16px 10px 14px;touch-action:pan-x pan-y;scroll-snap-type:x proximity}.shortcut{flex:0 0 76px;min-width:0;scroll-snap-align:start;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;animation:none}.circle{width:48px;height:48px;border-radius:50%;margin-bottom:9px}.shortcut span:last-child{font-size:12px}.shortcut .pinned::before{content:'⌖ ';color:#54719c}
</style></head><body><main>
<div class="brand"><div class="mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 7.5c4-1.5 7-1 11 1.5 4-2.5 7-3 11-1.5V25c-4-1.5-7-1-11 1.5C12 24 9 23.5 5 25V7.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 9v17M9 12h3m-3 5h3m8-5h3m-3 5h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><h1>漫游浏览器</h1><p>发现喜欢的网站，读懂每一页。</p></div>
<a class="search" href="https://manga-home.invalid/search" aria-label="搜索或输入网址，查看历史记录"><span class="g" aria-hidden="true">G</span><span class="search-prompt">搜索或输入网址</span><span aria-hidden="true">→</span></a><p class="hint">搜索由 Google 提供 · 顶部地址栏也可搜索或输入网址</p>

<div class="section-head sites-head"><h2>常用网站</h2><span>长按编辑</span></div><div class="shortcuts" id="sites" aria-label="常用网站，可左右滑动"><a class="shortcut" href="https://manga-home.invalid/shortcut-add"><span class="circle">＋</span><span>新增网站</span></a></div>
<section><div class="section-head"><h2>我的收藏</h2><a href="https://manga-home.invalid/bookmarks">查看全部</a></div><div id="bookmarks" class="panel"><p class="empty">遇到喜欢的网站，点菜单里的「收藏当前页面」。</p></div></section>
<section><div class="section-head"><h2>最近访问</h2><a href="https://manga-home.invalid/history">历史记录</a></div><div id="recent" class="panel"><p class="empty">从一次搜索开始，最近访问的网站会显示在这里。</p></div></section>

</main><script>
window.updateSites=function(items){const parent=document.getElementById('sites'),left=parent.scrollLeft;parent.replaceChildren();for(const site of items){let url;try{url=new URL(site.url);if(!['http:','https:'].includes(url.protocol))continue}catch(_){continue}const a=document.createElement('a');a.className='shortcut';a.href=url.href;a.dataset.site=site.key;a.setAttribute('aria-label',site.title+'，长按编辑');const icon=document.createElement('span');icon.className='circle';icon.textContent=(site.title||url.hostname).replace(/^www\./,'').slice(0,1).toUpperCase();let hash=0;for(const ch of site.key)hash=(hash*31+ch.charCodeAt(0))>>>0;const hue=hash%360;icon.style.background='hsl('+hue+' 50% 94%)';icon.style.color='hsl('+hue+' 55% 36%)';const title=document.createElement('span');title.textContent=site.title||url.hostname;title.className=site.pinned?'pinned':'';a.append(icon,title);parent.append(a)}const add=document.createElement('a');add.className='shortcut';add.href='https://manga-home.invalid/shortcut-add';add.innerHTML='<span class="circle">＋</span><span>新增网站</span>';parent.append(add);parent.scrollLeft=left};
let pressTimer=0,pressX=0,pressY=0,blockClickUntil=0;
const sites=document.getElementById('sites');
function cancelPress(){clearTimeout(pressTimer);pressTimer=0}
function editSite(a){blockClickUntil=Date.now()+800;location.href='https://manga-home.invalid/shortcut-edit?site='+encodeURIComponent(a.dataset.site)}
sites.addEventListener('pointerdown',e=>{cancelPress();const a=e.target.closest('[data-site]');if(!a)return;pressX=e.clientX;pressY=e.clientY;pressTimer=setTimeout(()=>editSite(a),550)});
sites.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-pressX,e.clientY-pressY)>9)cancelPress()});
for(const event of ['pointerup','pointercancel','scroll'])sites.addEventListener(event,cancelPress);
sites.addEventListener('click',e=>{if(Date.now()<blockClickUntil){e.preventDefault();e.stopPropagation()}},true);
sites.addEventListener('contextmenu',e=>{const a=e.target.closest('[data-site]');if(a){e.preventDefault();cancelPress();if(Date.now()>=blockClickUntil)editSite(a)}});
window.updateHome=function(id,items){const parent=document.getElementById(id);if(!parent)return;parent.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=id==='bookmarks'?'遇到喜欢的网站，点菜单里的「收藏当前页面」。':'从一次搜索开始，最近访问的网站会显示在这里。';parent.append(empty);return;}items.slice(0,3).forEach((item,index)=>{let url;try{url=new URL(item.url);if(!['http:','https:'].includes(url.protocol))return}catch(e){return}const a=document.createElement('a');a.className='row enter';a.style.animationDelay=(index*.06)+'s';a.href=url.href;const badge=document.createElement('span');badge.className='badge';badge.textContent=id==='bookmarks'?'☆':'↗';const words=document.createElement('span');words.className='words';const title=document.createElement('b');title.textContent=item.title||url.hostname;const host=document.createElement('small');host.textContent=url.hostname;words.append(title,host);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';a.append(badge,words,arrow);parent.append(a)})};
</script></body></html>
